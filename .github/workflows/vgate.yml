# Deploy lives in ci.yml (job "deploy") so it always runs after a green push to main.
# Kept as a no-op stub so old workflow links / badges do not 404.
name: Deploy VGATE API to cPanel via FTP

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual deploy reason'
        required: false
        default: 'manual'

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle (dist + package manifests)
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp package.json package-lock.json deploy/
          cp -r dist deploy/dist
          mkdir -p deploy/src/database deploy/src/common
          cp -r src/database/migrations deploy/src/database/migrations
          cp -r src/database/entities deploy/src/database/entities
          cp src/database/data-source.ts deploy/src/database/
          cp -r src/database/constants deploy/src/database/constants 2>/dev/null || true
          cp -r src/common/enums deploy/src/common/enums
          cp tsconfig.json nest-cli.json deploy/

      - name: Deploy runtime bundle to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_VGATE }}
          username: ${{ secrets.FTP_USERNAME_VGATE }}
          password: ${{ secrets.FTP_PASSWORD_VGATE }}
          server-dir: ${{ secrets.CPANEL_DIR_VGATE }}
          local-dir: deploy/
          protocol: ftp
