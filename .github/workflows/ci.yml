name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: stock_management_test
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: 'false'
      DB_SEED: 'true'
      JWT_AT_SECRET: ci-access-secret
      JWT_RT_SECRET: ci-refresh-secret
      JWT_AT_EXPIRES_IN: 1d
      JWT_RT_EXPIRES_IN: 7d
      SEED_ADMIN_EMAIL: admin@stock.local
      SEED_ADMIN_PASSWORD: Admin@123
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --runInBand

      - name: Run migrations
        run: npm run migration:run

      - name: E2E smoke
        run: npx jest --config ./test/jest-e2e.json --runInBand

  # cPanel FTP deploy — only after green CI on a push to main/master (not PRs)
  deploy:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Thin "deploy/" bundles break cPanel: FTP-Deploy mirrors local-dir and deletes
      # server files not in the bundle (full src/, etc.), then 553 on replace under dist/.
      - name: Reset stale FTP sync state on server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u '${{ secrets.FTP_USERNAME_VGATE }}','${{ secrets.FTP_PASSWORD_VGATE }}' ${{ secrets.FTP_SERVER_VGATE }};
            cd ${{ secrets.CPANEL_DIR_VGATE }};
            rm -f .ftp-deploy-sync-state.json;
            rm -r -f dist;
            bye
          "

      - name: Deploy app to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_VGATE }}
          username: ${{ secrets.FTP_USERNAME_VGATE }}
          password: ${{ secrets.FTP_PASSWORD_VGATE }}
          server-dir: ${{ secrets.CPANEL_DIR_VGATE }}
          local-dir: ./
          protocol: ftp
          exclude: |
            **/.git/**
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/uploads/**
            **/tmp/**
            **/coverage/**
            **/.nyc_output/**
            **/.env
            **/.env.*
            **/*.log
            **/stderr.log
            **/stdout.log
            **/deploy/**
            **/.cursor/**
            **/agent-transcripts/**
