name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: stock_management_test
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: 'false'
      DB_SEED: 'true'
      JWT_AT_SECRET: ci-access-secret
      JWT_RT_SECRET: ci-refresh-secret
      JWT_AT_EXPIRES_IN: 1d
      JWT_RT_EXPIRES_IN: 7d
      SEED_ADMIN_EMAIL: admin@stock.local
      SEED_ADMIN_PASSWORD: Admin@123
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npx jest --runInBand

      - name: Run migrations
        run: npm run migration:run

      - name: OpenAPI contract snapshot
        run: npm run openapi:export && git diff --exit-code -- docs/openapi.json

      - name: E2E smoke
        run: npx jest --config ./test/jest-e2e.json --runInBand
      - name: Stage cPanel release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-payload
          cp -R dist scripts release-payload/
          cp package.json package-lock.json release-payload/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cpanel-release
          path: release-payload/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to cPanel
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cpanel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-release
          path: release-payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload tested release
        env:
          FTP_SERVER_VGATE: ${{ secrets.FTP_SERVER_VGATE }}
          FTP_USERNAME_VGATE: ${{ secrets.FTP_USERNAME_VGATE }}
          FTP_PASSWORD_VGATE: ${{ secrets.FTP_PASSWORD_VGATE }}
          CPANEL_DIR_VGATE: ${{ secrets.CPANEL_DIR_VGATE }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_TLS_VERIFY: ${{ vars.FTP_TLS_VERIFY || 'false' }}
          FTP_CA_CERT: ${{ secrets.FTP_CA_CERT }}
          CPANEL_AUTO_RESTART: ${{ vars.CPANEL_AUTO_RESTART }}
        run: python scripts/deploy-cpanel.py
      - name: Deployment summary
        run: |
          echo '### cPanel upload completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the tested release payload was uploaded. FTP cannot install dependencies or run migrations.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If package dependencies changed, run NPM Install in cPanel. For API schema changes, back up and run migrations before restarting.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Restart in cPanel unless CPANEL_AUTO_RESTART=true is configured and host prerequisites are already satisfied.' >> "$GITHUB_STEP_SUMMARY"
