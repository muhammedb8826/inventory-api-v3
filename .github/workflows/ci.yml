name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: stock_management_test
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: 'false'
      DB_SEED: 'true'
      JWT_AT_SECRET: ci-access-secret
      JWT_RT_SECRET: ci-refresh-secret
      JWT_AT_EXPIRES_IN: 1d
      JWT_RT_EXPIRES_IN: 7d
      SEED_ADMIN_EMAIL: admin@stock.local
      SEED_ADMIN_PASSWORD: Admin@123
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npx jest --runInBand

      - name: Run migrations
        run: npm run migration:run

      - name: OpenAPI contract snapshot
        run: npm run openapi:export && git diff --exit-code -- docs/openapi.json

      - name: E2E smoke
        run: npx jest --config ./test/jest-e2e.json --runInBand
